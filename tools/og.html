<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>og poster renderer</title>
<style>body{margin:0;background:#333}canvas{display:block}</style></head>
<body>
<canvas id="og" width="1200" height="630"></canvas>
<script>
// Renders the 1200×630 Open Graph poster for The Regatta using the game's own
// visual vocabulary — no assets, every pixel from code. Open this page and
// pull canvas.toDataURL('image/png') to produce og-image.png.
const cv = document.getElementById('og'), ctx = cv.getContext('2d');
const W = 1200, H = 630;
const HULLS = ['#1a3a7e','#d29b12','#2e7d55','#7a4fbf','#c94f4f'];
const SHORE = 150;

// sky
let g = ctx.createLinearGradient(0,0,0,SHORE+120);
g.addColorStop(0,'#dff0fa'); g.addColorStop(1,'#bfe2ef');
ctx.fillStyle=g; ctx.fillRect(0,0,W,SHORE+120);
// sun
const sg = ctx.createRadialGradient(W-190,70,6,W-190,70,95);
sg.addColorStop(0,'#fff6d8'); sg.addColorStop(0.35,'rgba(255,244,204,.65)'); sg.addColorStop(1,'rgba(255,244,204,0)');
ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(W-190,70,95,0,7); ctx.fill();
// clouds
ctx.fillStyle='rgba(255,255,255,.9)';
[[180,52],[560,38],[820,66],[1040,44]].forEach(([cx,cy])=>{
  for(let p=0;p<4;p++){ ctx.beginPath(); ctx.arc(cx+p*26-38, cy+(p%2?6:0), 18-(p%2)*4, 0, 7); ctx.fill(); }
});
// headland, two planes
ctx.fillStyle='#c2d8cd';
ctx.beginPath(); ctx.moveTo(0,SHORE+20);
ctx.quadraticCurveTo(W*0.3,SHORE-46,W*0.62,SHORE+14);
ctx.quadraticCurveTo(W*0.8,SHORE+38,W,SHORE+10); ctx.lineTo(W,SHORE+90); ctx.lineTo(0,SHORE+90); ctx.fill();
ctx.fillStyle='#93b8a2';
ctx.beginPath(); ctx.moveTo(0,SHORE+34);
ctx.quadraticCurveTo(W*0.18,SHORE-32,W*0.38,SHORE+26);
ctx.quadraticCurveTo(W*0.55,SHORE+52,W,SHORE+32); ctx.lineTo(W,SHORE+90); ctx.lineTo(0,SHORE+90); ctx.fill();
// lighthouse
const lx = W*0.2;
ctx.fillStyle='#ddd6c4'; ctx.fillRect(lx-8, SHORE-58, 16, 52);
ctx.fillStyle='#c94f4f'; ctx.fillRect(lx-8, SHORE-58, 16, 11); ctx.fillRect(lx-8, SHORE-33, 16, 9);
ctx.fillStyle='#3d4a55'; ctx.fillRect(lx-11, SHORE-64, 22, 8);
ctx.strokeStyle='rgba(61,74,85,.55)'; ctx.lineWidth=1.5; ctx.strokeRect(lx-8.5, SHORE-58.5, 17, 53);
// surf line
ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=3;
ctx.beginPath(); ctx.moveTo(0,SHORE+62); ctx.quadraticCurveTo(W*0.5,SHORE+74,W,SHORE+64); ctx.stroke();
// sea
g = ctx.createLinearGradient(0,SHORE+60,0,H);
g.addColorStop(0,'#a4d4e4'); g.addColorStop(0.35,'#79b7cf');
g.addColorStop(0.7,'#5197b6'); g.addColorStop(1,'#3a7d9c');
ctx.fillStyle=g; ctx.fillRect(0,SHORE+60,W,H);
// caustic patches
[[260,330],[700,430],[1050,360]].forEach(([cx,cy])=>{
  const cg = ctx.createRadialGradient(cx,cy,12,cx,cy,190);
  cg.addColorStop(0,'rgba(255,255,255,.16)'); cg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(cx,cy,190,0,7); ctx.fill();
});
// wave bands
const bands = [
  { y0:SHORE+92,  n:3, gap:30, amp:2,   a:.18, w:1.4 },
  { y0:SHORE+200, n:3, gap:42, amp:3,   a:.3,  w:2.2 },
  { y0:SHORE+340, n:3, gap:54, amp:4.2, a:.45, w:3.2 },
];
for(const b of bands){
  ctx.strokeStyle=`rgba(255,255,255,${b.a})`; ctx.lineWidth=b.w;
  for(let r=0;r<b.n;r++){
    const y = b.y0 + r*b.gap;
    ctx.beginPath();
    for(let x=0;x<=W;x+=16){
      const yy = y + Math.sin(x*0.03 + r*1.7 + b.y0)*b.amp;
      x===0?ctx.moveTo(x,yy):ctx.lineTo(x,yy);
    }
    ctx.stroke();
  }
}
// finish line + checkered committee flag, right edge
ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.setLineDash([10,10]); ctx.lineWidth=3;
ctx.beginPath(); ctx.moveTo(W-118,SHORE+90); ctx.lineTo(W-118,H-20); ctx.stroke();
ctx.setLineDash([]);
ctx.strokeStyle='#5a5348'; ctx.lineWidth=3;
ctx.beginPath(); ctx.moveTo(W-118,SHORE+40); ctx.lineTo(W-118,SHORE+92); ctx.stroke();
for(let r=0;r<3;r++) for(let c=0;c<4;c++){
  ctx.fillStyle=(r+c)%2?'rgba(44,53,64,.85)':'#f4f2ea';
  ctx.fillRect(W-118+c*8, SHORE+40+r*7.5, 8, 7.5);
}

// the fleet, racing — staggered mid-course, big colored jibs
function boat(x, y, s, hull, belly){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.rotate(-0.06);
  // shadow + reflection
  ctx.fillStyle='rgba(20,60,80,.22)';
  ctx.beginPath(); ctx.ellipse(0, 15, 30, 5, 0, 0, 7); ctx.fill();
  ctx.fillStyle=hull+'2e';
  for(let r=0;r<3;r++) ctx.fillRect(-(16-r*4)/2 + (r%2?3:-2), 19+r*4, 16-r*4, 2);
  // wake
  ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(-27,10); ctx.quadraticCurveTo(-52,14,-84,9);
  ctx.moveTo(-27,13); ctx.quadraticCurveTo(-47,19,-72,18); ctx.stroke();
  ctx.lineWidth=1.5; ctx.strokeStyle='rgba(30,40,50,.35)';
  // hull
  ctx.fillStyle=hull;
  ctx.beginPath(); ctx.moveTo(-30,6); ctx.quadraticCurveTo(0,19,33,6);
  ctx.lineTo(23,16); ctx.quadraticCurveTo(0,24,-21,16); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fillRect(-21,15,44,3);
  // mast
  ctx.strokeStyle='#5a5348'; ctx.lineWidth=2.2;
  ctx.beginPath(); ctx.moveTo(2,8); ctx.lineTo(2,-42); ctx.stroke();
  // mainsail, cream
  ctx.fillStyle='#f6f1e2';
  ctx.beginPath(); ctx.moveTo(2,-40); ctx.quadraticCurveTo(2+belly,-18,2,5); ctx.closePath();
  ctx.fill(); ctx.strokeStyle='rgba(30,40,50,.35)'; ctx.lineWidth=1.5; ctx.stroke();
  // jib in identity color
  ctx.fillStyle=hull;
  ctx.beginPath(); ctx.moveTo(3,-34); ctx.quadraticCurveTo(20,-15,31,5); ctx.lineTo(3,2); ctx.closePath();
  ctx.fill(); ctx.strokeStyle='rgba(30,40,50,.3)'; ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.25)';
  ctx.beginPath(); ctx.moveTo(3,-34); ctx.quadraticCurveTo(12,-16,17,4); ctx.lineTo(3,2); ctx.closePath(); ctx.fill();
  // pennant
  ctx.fillStyle=hull;
  ctx.beginPath(); ctx.moveTo(2,-42); ctx.lineTo(12,-39.5); ctx.lineTo(2,-37); ctx.fill();
  ctx.restore();
}
// staggered race order, nearest lane largest (depth); the whole fleet stays
// clear of the title panel (left) and inside the frame (bottom)
boat(770, SHORE+124, 1.15, HULLS[0], 14);
boat(640, SHORE+190, 1.3,  HULLS[1], 12);
boat(850, SHORE+252, 1.45, HULLS[2], 16);
boat(700, SHORE+322, 1.6,  HULLS[3], 13);
boat(900, SHORE+392, 1.75, HULLS[4], 15);

// title block, lower-left on a soft paper panel
const px=48, py=H-206, pw=560, ph=168;
ctx.fillStyle='rgba(247,241,227,.96)';
ctx.strokeStyle='#d9cdb4'; ctx.lineWidth=2;
ctx.beginPath(); ctx.roundRect(px,py,pw,ph,18); ctx.fill(); ctx.stroke();
ctx.fillStyle='#1e6f8e'; ctx.fillRect(px,py,pw,6);
// burgee
ctx.fillStyle='#c94f4f';
ctx.beginPath(); ctx.moveTo(px+34,py+38); ctx.lineTo(px+34,py+92); ctx.lineTo(px+38,py+92); ctx.lineTo(px+38,py+70); ctx.lineTo(px+78,py+52); ctx.lineTo(px+38,py+38); ctx.closePath(); ctx.fill();
ctx.fillStyle='#232e38';
ctx.font='700 58px "Iowan Old Style",Palatino,Georgia,serif';
ctx.fillText('THE REGATTA', px+96, py+78);
ctx.fillStyle='#5c6a76';
ctx.font='italic 27px Georgia,serif';
ctx.fillText('the next tide runs the race', px+96, py+116);
ctx.font='600 19px system-ui,sans-serif';
ctx.fillStyle='#1e6f8e';
ctx.fillText('provably fair · the next Bitcoin block decides · pure static', px+96, py+148);
</script>
</body>
</html>
